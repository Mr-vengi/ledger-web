name: ledger
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.2
  pdf: ^3.11.1
  excel: ^4.0.6
  path_provider: ^2.1.5

  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  printing: ^5.11.0
  share_plus: ^10.1.4
  open_file: ^3.5.11
  intl: ^0.20.2
  fl_chart: ^0.68.0
  shared_preferences: ^2.3.2
  mockito: ^5.5.1
  qr_flutter: ^4.1.0
  image_picker: ^1.0.0
  http: ^1.2.0
  device_info_plus: ^10.1.0
  universal_io: ^2.2.0
  crypto: ^3.0.6



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/fonts/

  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/icon/fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/icon/fonts/NotoSansTamil-Bold.ttf
          weight: 700
